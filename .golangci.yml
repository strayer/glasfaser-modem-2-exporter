version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - staticcheck
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  tests: true
