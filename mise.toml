[tools]
go = "1.27.3"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"

[tasks.format]
description = "Format Go source"
run = "goimports -w ."

[tasks.format-check]
description = "Require goimports-clean source"
run = "test -z \"$(goimports -l .)\""

[tasks.test]
description = "Run unit tests"
run = "go test -race -cover ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.golangci-lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.govulncheck]
description = "Scan dependencies and stdlib for known vulnerabilities"
run = "govulncheck ./..."

[tasks.lint]
description = "Run all static checks"
depends = ["format-check", "vet", "golangci-lint", "govulncheck"]

[tasks.run]
description = "Run the exporter locally (see README for flags)"
run = "go run ./cmd/glasfaser-modem-2-exporter"
